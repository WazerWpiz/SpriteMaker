name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships a full Android SDK at $ANDROID_HOME.
      # Do NOT use android-actions/setup-android: it tries to install the
      # legacy 'tools' package, which was removed from the SDK repository.
      - name: Install required SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMANAGER"
          test -n "$SDKMANAGER" || { echo 'sdkmanager not found in cmdline-tools'; ls -R "$ANDROID_HOME" | head -40; exit 1; }
          export PATH="$(dirname "$SDKMANAGER"):$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # cloudflared is built from source with cgo instead of downloading the
      # official static binary. Reason: Android has no /etc/resolv.conf, so Go's
      # pure resolver falls back to 127.0.0.1:53, which is unroutable and
      # unprivileged apps cannot bind anyway ("lookup api.trycloudflare.com on
      # [::1]:53: connection refused"). Go's own net/conf.go says
      # "case android: return true" — "DNS requests don't work on Android, so
      # prefer the cgo resolver" — so a cgo build goes through bionic
      # getaddrinfo/netd exactly like the app does.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Build cloudflared for Android arm64 (cgo)
        run: |
          set -euo pipefail
          LOG=/tmp/cf-build.log
          build() {
            NDK="${ANDROID_NDK_LATEST_HOME:-}"
            if [ -z "${NDK}" ] || [ ! -d "${NDK}" ]; then
              NDK="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1 || true)"
            fi
            if [ -z "${NDK}" ] || [ ! -d "${NDK}" ]; then
              SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)
              yes | "$SDKMANAGER" --install "ndk;27.2.12479018" > /dev/null 2>&1 || true
              NDK="$ANDROID_HOME/ndk/27.2.12479018"
            fi
            echo "NDK: $NDK"
            CC_BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
            ls -la "$CC_BIN"

            git clone --depth 1 --branch 2026.11.0 \
              https://github.com/cloudflare/cloudflared.git /tmp/cloudflared-src
            cd /tmp/cloudflared-src
            go version
            mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
            CGO_ENABLED=1 GOOS=android GOARCH=arm64 GOTOOLCHAIN=auto CC="$CC_BIN" \
              go build -trimpath -buildmode=pie -ldflags="-s -w" \
              -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libcloudflared.so" \
              ./cmd/cloudflared
            file "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libcloudflared.so"
            ls -la "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/"
          }
          if ! build > "$LOG" 2>&1; then
            # Job logs are not readable without admin rights, so surface the tail
            # of the compiler output as an annotation, which the API does expose.
            tail -25 "$LOG" | tr '\n' '|' | cut -c1-900 | sed 's/^/::error::cloudflared build failed: /'
            tail -60 "$LOG"
            exit 1
          fi
          tail -3 "$LOG"

      - name: Build debug APK
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace --no-daemon > /tmp/gradle.log 2>&1
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            # Job logs need admin rights to read, so surface the Kotlin compiler
            # errors as annotations, which the REST API does expose.
            grep -E "^e: |error: |Unresolved reference|Compilation error|Caused by" /tmp/gradle.log \
              | head -15 | tr '\n' '|' | cut -c1-900 | sed 's/^/::error::gradle: /'
            tail -40 /tmp/gradle.log
            exit "$RC"
          fi
          tail -5 /tmp/gradle.log

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcpresprite-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/logs/*
          if-no-files-found: warn
          retention-days: 14

      # Also publish the APK as a release asset so it can be downloaded from a
      # phone without a GitHub login. Rolling tag: each push replaces the asset
      # on the 'latest-debug' release instead of piling up release history.
      - name: Publish debug APK to release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          test -n "$APK" || { echo 'no APK built'; exit 1; }
          cp "$APK" app-debug.apk
          NOTES="Built from ${GITHUB_SHA::7}. Installs as com.fengeon.resprite_desktop.debug (separate from the original app). Local tool API on http://127.0.0.1:47613/call once started from the gear button."
          if gh release view latest-debug >/dev/null 2>&1; then
            gh release upload latest-debug app-debug.apk --clobber
            gh release edit latest-debug --notes "$NOTES"
          else
            gh release create latest-debug app-debug.apk --title "Debug APK (latest)" --notes "$NOTES"
          fi

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            **/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
