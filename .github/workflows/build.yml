name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships a full Android SDK at $ANDROID_HOME.
      # Do NOT use android-actions/setup-android: it tries to install the
      # legacy 'tools' package, which was removed from the SDK repository.
      - name: Install required SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMANAGER"
          test -n "$SDKMANAGER" || { echo 'sdkmanager not found in cmdline-tools'; ls -R "$ANDROID_HOME" | head -40; exit 1; }
          export PATH="$(dirname "$SDKMANAGER"):$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # The tunnel feature execs the real cloudflared binary. It is ~36 MB, so it
      # is fetched at build time rather than committed to the repo.
      - name: Bundle cloudflared (arm64)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -sSL --retry 3 -o app/src/main/jniLibs/arm64-v8a/libcloudflared.so \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-arm64
          chmod +x app/src/main/jniLibs/arm64-v8a/libcloudflared.so
          ls -la app/src/main/jniLibs/arm64-v8a/
          head -c 4 app/src/main/jniLibs/arm64-v8a/libcloudflared.so | xxd | head -1

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcpresprite-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/logs/*
          if-no-files-found: warn
          retention-days: 14

      # Also publish the APK as a release asset so it can be downloaded from a
      # phone without a GitHub login. Rolling tag: each push replaces the asset
      # on the 'latest-debug' release instead of piling up release history.
      - name: Publish debug APK to release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          test -n "$APK" || { echo 'no APK built'; exit 1; }
          cp "$APK" app-debug.apk
          NOTES="Built from ${GITHUB_SHA::7}. Installs as com.fengeon.resprite_desktop.debug (separate from the original app). Local tool API on http://127.0.0.1:47613/call once started from the gear button."
          if gh release view latest-debug >/dev/null 2>&1; then
            gh release upload latest-debug app-debug.apk --clobber
            gh release edit latest-debug --notes "$NOTES"
          else
            gh release create latest-debug app-debug.apk --title "Debug APK (latest)" --notes "$NOTES"
          fi

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            **/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
